# Fly.io deploy config: app (API) + worker (scheduler)
app = "tft-iq-backend"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info,tft_iq=info"
  RIOT_PLATFORM = "kr"
  RIOT_REGION = "asia"
  BIND_ADDR = "0.0.0.0:8080"
  SCHED_INTERVAL_SECS = "21600"  # 6 hours

# app = API server, worker = scheduler
[processes]
  app = "/app/server"
  worker = "/app/scheduler"

# HTTP service (app process only)
[http_service]
  internal_port = 8080
  force_https = true
  processes = ["app"]
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"